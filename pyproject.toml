[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-safety-redteaming"
version = "1.0.0"
description = "Practical frameworks, attack demonstrations, and defensive tools for securing Large Language Models"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Mohammed Arsalan", email = "author@example.com"}
]
maintainers = [
    {name = "Mohammed Arsalan", email = "author@example.com"}
]
keywords = [
    "ai-safety",
    "red-teaming",
    "llm-security",
    "prompt-injection",
    "jailbreaking",
    "guardrails",
    "machine-learning",
    "cybersecurity",
    "adversarial-ml"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security",
    "Topic :: Software Development :: Testing",
]
requires-python = ">=3.10"
dependencies = [
    "openai>=1.0.0",
    "anthropic>=0.20.0",
    "transformers>=4.35.0",
    "torch>=2.0.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "requests>=2.31.0",
    "tiktoken>=0.5.0",
]

[project.optional-dependencies]
guardrails = [
    "nemoguardrails>=0.9.0",
    "deepeval>=0.21.0",
    "guardrails-ai>=0.4.0",
    "langchain>=0.1.0",
]
evaluation = [
    "ragas>=0.1.0",
    "garak>=0.9.0",
]
web = [
    "gradio>=4.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "mypy>=1.5.0",
    "ruff>=0.1.0",
]
notebooks = [
    "jupyter>=1.0.0",
    "ipython>=8.12.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "plotly>=5.15.0",
]
all = [
    "ai-safety-redteaming[guardrails,evaluation,web,dev,notebooks]",
]

[project.urls]
Homepage = "https://github.com/username/ai-safety-redteaming"
Documentation = "https://github.com/username/ai-safety-redteaming#readme"
Repository = "https://github.com/username/ai-safety-redteaming.git"
Issues = "https://github.com/username/ai-safety-redteaming/issues"
Changelog = "https://github.com/username/ai-safety-redteaming/blob/main/docs/CHANGELOG.md"

[project.scripts]
ai-safety = "ai_safety_redteaming.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["ai_safety_redteaming*"]

[tool.setuptools.package-data]
"*" = ["*.yaml", "*.yml", "*.json", "*.co"]

# Black configuration
[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
    | node_modules
)/
'''

# isort configuration
[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["ai_safety_redteaming"]
skip = [".git", ".venv", "venv", "node_modules"]

# Ruff configuration
[tool.ruff]
line-length = 100
target-version = "py310"
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]
"tests/*" = ["S101"]

# MyPy configuration
[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
ignore_missing_imports = true
exclude = [
    "venv",
    ".venv",
    "build",
    "dist",
]

# Pytest configuration
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
    "-ra",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "requires_api: marks tests that require API keys",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

# Coverage configuration
[tool.coverage.run]
source = ["ai_safety_redteaming"]
branch = true
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/venv/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
